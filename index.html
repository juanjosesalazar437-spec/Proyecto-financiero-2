<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Proyecto financiero</title>
  <meta name="description" content="Tu web de finanzas en un solo lugar: ingresos, gastos, gastos hormiga, educación financiera y precios del mercado.">
  <meta name="theme-color" content="#002c81">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Barra superior (frames: Comienzo, Historiales, Gastos, Educación…) -->
  <header class="topbar" id="topbar" hidden>
    <button class="topbar__left" id="btnBack" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>
    </button>
    <button class="topbar__left avatar" id="btnAvatar" aria-label="Menú de perfil"><span id="avatarInitial"></span></button>
    <nav class="topbar__nav" aria-label="Navegación principal">
      <a href="#/inicio" data-tab="inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-6h6v6"/></svg><span>Inicio</span></a>
      <a href="#/finanzas" data-tab="finanzas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 20v-5M12 20V9M18 20V4"/></svg><span>Finanzas</span></a>
      <a href="#/gastos" data-tab="gastos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 13h2M3 9l13-5 1 2"/></svg><span>Gastos</span></a>
      <a href="#/educacion" data-tab="educacion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h12"/></svg><span>Educación</span></a>
    </nav>
    <button class="topbar__bell" id="btnBell" aria-label="Notificaciones">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 17V11a6 6 0 0 1 9-5.2"/><path d="M18 11v6l2 2H4l2-2"/><path d="M10 21h4"/><circle cx="18.5" cy="5.5" r="2.5"/></svg>
      <span class="dot" id="bellDot" hidden></span>
    </button>
    <div class="dropdown" id="menuPerfil" hidden></div>
    <div class="dropdown dropdown--right" id="menuAvisos" hidden></div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="modal" id="modal" hidden>
    <div class="modal__box" role="dialog" aria-modal="true" id="modalBox"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="offline" id="offlineBadge" hidden>Sin conexión · tus datos se guardan en este dispositivo</div>

  <script src="app.js"></script>
</body>
</html>
